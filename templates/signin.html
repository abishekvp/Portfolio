{% extends 'base.html' %}
{% block title %}Sign-In{% endblock title %}
{% block sign %}
<div class="login-wrapper theme-dark">
    <div class="d-flex justify-content-center mt-5">
        <div class="card wi-60 p-4 mt-5" style="width: 50%;" id="login-card">
            <h1 class="text-center mb-4">Sign In</h1>
            <form action="" method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <input type="text" name="username" id="username" class="form-control" placeholder="Username or Email" required>
                </div>
                <div class="mb-3">
                    <input type="password" name="password" id="password" class="form-control" placeholder="Password" required>
                </div>
                <div class="text-center">
                    <input type="submit" value="Sign In" class="btn btn-primary w-100 custom-btn">
                </div>
            </form>
            <div class="text-center mt-3">
                Don't have an account? <a href="signup">Sign Up</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
