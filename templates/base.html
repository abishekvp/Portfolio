{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0' name='viewport' />
    <meta name="viewport" content="width=device-width" />
    <meta name="description" content="Fee Bootstrap Admin Theme with Webpack and Laravel-Mix" />
    <meta name="keywords" content="bootstrap, admin theme, admin dashboard, jquery, webpack, laravel-mix, template, responsive" />
    <meta name="author" content="siQuang - Simon Nguyen" />
    
    <title>{% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/siqtheme.css' %}">

    <link rel="apple-touch-icon" sizes="76x76" href="{% static 'assets/img/apple-icon.png' %}">
    <link rel="icon" type="image/png" sizes="96x96" href="{% static 'assets/img/favicon.png' %}">
    <link rel="stylesheet" href="{% static 'assets/css/pages/dashboard1.css' %}">
</head>

<body class="theme-dark overflow-x-hidden">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}" hidden>
    <!-- Website block -->
    {% block index %}{% endblock %}

    <!-- Sign In and Up block -->
    {% block sign %}{% endblock %}

    <!-- Modals -->
    <div class="modal fade" id="addKeyValue" tabindex="-1" role="dialog" aria-labelledby="addKeyValueTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addKeyValueTitle">Vertically Centered Modal</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <!-- BOF MAIN-BODY -->
                    <div class="row">
                        <!-- BOF General Form -->
                        <div class="col-lg-12">
                            <div class="card mb-3">
                                <form role="form">
                                    <!-- <div class="card-header uppercase">
                                        <div class="caption">
                                            <i class="ti-briefcase"></i> General Form
                                        </div>
                                        <div class="tools">
                                            <a href="#" class="btn btn-outline-secondary"><i class="ti-pencil-alt"></i></a>
                                            <a href="#" class="btn btn-outline-secondary"><i class="ti-settings"></i></a>
                                        </div>
                                    </div> -->
                                    <div class="card-body">
                                        <div class="form-group">
                                            <div class="input-group">
                                                <div class="input-group-prepend">
                                                    <span class="input-group-text">Data Key</span>
                                                </div>
                                                <input type="text" name="data-key" id="data-key" class="form-control" autocomplete="off" placeholder="Key for Data" title="Only alphabetic characters and underscores are allowed." oninput="this.value = this.value.replace(/[^a-zA-Z_]/g, '');">
                                            </div>
                                        </div>
                                        <div class="form-group">
                                            <label>Key Data Value</label>
                                            <div class="input-group">
                                                <div class="input-group-prepend">
                                                    <span class="input-group-text"><i class="ti-info-alt"></i></span>
                                                </div>
                                                <textarea cols="64" rows="10" name="data-value" id="data-value" class="form-control" placeholder="Write about..."></textarea>
                                            </div>
                                        </div>
                                        <div class="form-checkbox">
                                            <label>
                                                <input type="checkbox" name="raw-html" id="raw-html">
                                                <span class="checkmark"><i class="fa fa-check"></i></span>
                                                Raw HTML
                                            </label>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>
                        <!-- EOF General Form -->
                    </div>
                    <!-- EOF General Form -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-outline-primary" data-dismiss="modal" onclick="addKeyValueData()">Add</button>
                </div>
            </div>
        </div>
    </div>

    <!-- JS Imports -->
    <script src="{% static 'js/constants.js' %}"></script>
    <script src="{% static 'assets/scripts/jquery.in.js.js' %}"></script>
    <script src="{% static 'assets/scripts/siqtheme.js' %}"></script>
    <script src="{% static 'assets/scripts/pages/dashboard1.js' %}"></script>
    <script src="{% static 'assets/scripts/page.js' %}"></script>
    <script src="{% static 'js/main.js' %}"></script>
    <script src="{% static 'js/function.js' %}"></script>
</body>

</html>
