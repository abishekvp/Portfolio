{% extends 'index.html' %}
{% load static %}
{% block title %}Experiences - P.M{% endblock title %}
{% block main %}
    <!-- BOF MAIN -->
    <div class="main">

        <!-- BOF Breadcrumb -->
        <div class="row">
            <div class="col">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="javascript:;"><i class="ti-home"></i> Dashboard</a></li>
                </ol>
            </div>
        </div>
        <!-- EOF Breadcrumb -->
        <div class="row">
            <div class="col">
                <div class="card mb-3">
                    <div class="card-header">
                        <div class="caption uppercase">
                            <i class="ti-briefcase"></i> Education
                        </div>
                        <div class="tools">
                            <span data-toggle="modal" data-target="#addKeyValue" class="btn btn-sm btn-primary"><i class="ti-plus"></i></span>
                            <span class="btn btn-outline-secondary"><i class="ti-settings"></i></span>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped table-bordered table-hover init-datatable" id="">
                                <thead class="thead-light">
                                    <tr>
                                        <th>ID</th>
                                        <th>KEY</th>
                                        <th>VALUE</th>
                                        <th>HTML</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {% for data in table_data %}
                                    <tr>
                                        <td>{{ data.id }}</td>
                                        <td>{{ data.key }}</td>
                                        <td>{{ data.value }}</td>
                                        <td>{{ data.html }}</td>
                                        <td style="margin: auto; display: flex; justify-content: center;">
                                            <button style="margin: 10px;" onclick="editData('{{ data.id }}')" class="btn btn-outline-primary"><i class="ti-pencil-alt"></i></button>
                                            <a href="/delete-key-value/{{ data.id }}" style="margin: 10px;" class="btn btn-outline-danger"><i class="ti-trash"></i></a>
                                        </td>
                                    </tr>
                                    {% endfor %}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- EOF MAIN -->
{% endblock %}
